name: Build

# 每次推送到 master 都會：建置 → 測試 → 產生兩種單一執行檔 → 自動跳版號並發布 Release。
# 推送到 dev/ 開頭的分支只會建置與測試，不發布，用來在合併前先驗證。
# 版號規則見 .github/scripts/next-version.sh。只改 Markdown 文件不會觸發。
on:
  push:
    branches: [master, 'dev/**']
    paths-ignore:
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: BatteryCPUMonitor/BatteryCPUMonitor.csproj

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 計算版號需要完整的提交紀錄與標籤

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: 計算版本號
        id: version
        run: |
          next=$(bash .github/scripts/next-version.sh)
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/master" ]; then
            echo "version=$next" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$next-dev" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "下一個版本：$next"

      - name: 建置
        run: dotnet build BatteryCPUMonitor.sln -c Release -p:Version=${{ steps.version.outputs.version }}

      - name: 測試
        id: test
        env:
          MSYS_NO_PATHCONV: 1
          PYTHONUTF8: 1
          # 自動更新的測試會對真正的 GitHub 查詢；帶上內建的 token 可以避免被限制查詢次數。
          GITHUB_TOKEN: ${{ github.token }}
          SCREENSHOT_DIR: ${{ github.workspace }}\screenshots
        run: |
          # 測試失敗時先不中斷，讓下一行把失敗原因整理成錯誤註記。
          dotnet test BatteryCPUMonitor.sln -c Release --no-build \
            --logger "trx;LogFileName=results.trx" --results-directory testresults || true

          # 有測試失敗，或一項都沒執行到，這一步就會失敗。
          python .github/scripts/test-summary.py testresults/results.trx

      # dev 分支：把測試時擷取的實際畫面推到 ci-screenshots 分支，合併前可以先看外觀。
      - name: 上傳畫面截圖
        if: always() && startsWith(github.ref, 'refs/heads/dev/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls screenshots/*.png >/dev/null 2>&1 || { echo "沒有截圖"; exit 0; }
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.png
          git commit -q -m "CI 截圖：$GITHUB_SHA"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: 產生單一執行檔
        run: |
          v=${{ steps.version.outputs.version }}

          # 精簡版：需要電腦已安裝 .NET 10 桌面執行階段
          dotnet publish "$PROJECT" -c Release -r win-x64 --self-contained false \
            -p:PublishSingleFile=true -p:Version=$v -o publish/lite

          # 免安裝完整版：執行階段一併包進 exe
          dotnet publish "$PROJECT" -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:Version=$v -o publish/standalone

          mkdir -p dist
          cp publish/lite/BatteryCPUMonitor.exe "dist/BatteryCPUMonitor-v$v.exe"
          cp publish/standalone/BatteryCPUMonitor.exe "dist/BatteryCPUMonitor-v$v-standalone.exe"
          ls -l dist

      # 自動更新靠這兩件事才能運作：執行檔要能自己說出版本號，並知道自己是精簡版還是完整版。
      # 這裡把剛發布出來的兩個檔案真的執行一次，確認這兩項都正確。
      - name: 自我檢查（實際執行發布出來的執行檔）
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $cases = @(
            @{ File = "dist/BatteryCPUMonitor-v$v.exe";            Variant = "lite" },
            @{ File = "dist/BatteryCPUMonitor-v$v-standalone.exe"; Variant = "standalone" }
          )

          foreach ($case in $cases) {
            $report = Join-Path $env:RUNNER_TEMP "selfcheck-$($case.Variant).txt"
            Remove-Item $report -ErrorAction SilentlyContinue
            $file = (Resolve-Path $case.File).Path

            $process = Start-Process -FilePath $file -ArgumentList "--self-check", "`"$report`"" -PassThru
            if (-not $process.WaitForExit(120000)) {
              $process.Kill()
              throw "$($case.File) 自我檢查逾時"
            }
            if ($process.ExitCode -ne 0) { throw "$($case.File) 自我檢查失敗，結束碼 $($process.ExitCode)" }
            if (-not (Test-Path $report)) { throw "$($case.File) 沒有產生報告" }

            $text = Get-Content $report -Raw
            Write-Host "$($case.File)：$(($text.Trim() -split "`r?`n") -join '，')"
            if ($text -notmatch "(?m)^version=$([regex]::Escape($v))\r?$") { throw "$($case.File) 的版本號不是 $v" }
            if ($text -notmatch "(?m)^variant=$($case.Variant)\r?$") { throw "$($case.File) 的種類不是 $($case.Variant)" }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: BatteryCPUMonitor-v${{ steps.version.outputs.version }}
          path: dist/*.exe
          if-no-files-found: error

      - name: 發布 Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_PASSED: ${{ steps.test.outputs.passed }}
        run: |
          v=${{ steps.version.outputs.version }}
          bash .github/scripts/release-notes.sh "$v" > release-notes.md
          cat release-notes.md
          gh release create "v$v" dist/*.exe \
            --target "$GITHUB_SHA" \
            --title "v$v" \
            --notes-file release-notes.md
